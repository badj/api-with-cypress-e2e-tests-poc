name: Item API Deploy and E2E Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 19 * * *'  # 9 am NZT (UTC+12)
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Cache Cypress binary
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-15.19.0
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install app dependencies
        run: npm ci

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Run unit tests
        run: npm test

      - name: Start API
        run: |
          nohup node server.js &
          npx wait-on http://localhost:3333/api-docs --timeout 30000

      - name: Run Cypress tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/e2e \
            -w /e2e \
            -e CYPRESS_baseUrl=http://localhost:3333 \
            --network host \
            cypress/included:15.19.0@sha256:fe59f2cac5c7451644c8780cb2fb6735fde512d06642117199a7479269702f03 \
            npx cypress run

      - name: Upload Cypress test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cypress-results
          path: |
            cypress/reports/html

      - name: Cleanup
        if: always()
        run: pkill node || true
